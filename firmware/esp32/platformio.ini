[platformio]
src_dir = main
default_envs = indicator_esp32

[env:indicator_esp32]
platform = platformio/espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = espidf
upload_protocol = esptool
upload_speed = 460800
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.flash_mode = qio
